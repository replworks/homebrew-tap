name: Cloudflare Worker

on:
    push:
        branches: [main]
        paths:
            - "Casks/**"
            - "index.html"
            - "404.html"
            - "wrangler.jsonc"
            - ".github/workflows/cloudflare-worker.yml"
    pull_request:
        branches: [main]
        paths:
            - "Casks/**"
            - "index.html"
            - "404.html"
            - "wrangler.jsonc"
            - ".github/workflows/cloudflare-worker.yml"
    workflow_dispatch:

permissions:
    contents: read
    deployments: write

concurrency:
    group: cloudflare-worker
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Build landing page
              run: |
                  mkdir -p site
                  python3 - <<'PY'
                  import html
                  import pathlib
                  import re

                  def field(text, key):
                      match = re.search(rf'^\s*{key}\s+"([^"]*)"', text, re.M)
                      return match.group(1) if match else ""

                  rows = []
                  for path in sorted(pathlib.Path("Casks").glob("*.rb")):
                      text = path.read_text()
                      homepage = field(text, "homepage")
                      link = ""
                      if homepage.startswith(("https://", "http://")):
                          link = f'<a href="{html.escape(homepage, quote=True)}">GitHub</a>'
                      rows.append(
                          '    <li><div class="top">'
                          f'<strong>{html.escape(path.stem)}</strong>'
                          f'<span class="ver">{html.escape(field(text, "version"))}</span>'
                          f'{link}</div>'
                          f'<p>{html.escape(field(text, "desc"))}</p></li>'
                      )

                  page = pathlib.Path("index.html").read_text().replace("<!--PACKAGES-->", "\n".join(rows))
                  pathlib.Path("site/index.html").write_text(page)
                  not_found = pathlib.Path("404.html")
                  pathlib.Path("site/404.html").write_text(not_found.read_text() if not_found.exists() else page)
                  PY

            - name: Deploy Worker
              if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: deploy
